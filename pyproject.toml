[project]
name = "threedtrees-trajectory"
version = "0.1.0"
description = "Moving lidar sensor trajectory (ULS/MLS/ALS) estimated from the point cloud alone"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "laspy[lazrs]==2.6.1",
  "lazrs==0.7.0",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "pyproj==3.7.2",  # laspy needs it to read the CRS from the header
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
3dtrees-trajectory = "threedtrees_trajectory.cli:main"
3dtrees-trajectory-geojson = "threedtrees_trajectory.output:main_geojson"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
