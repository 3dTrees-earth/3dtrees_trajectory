[project]
name = "threedtrees-trajectory"
version = "1.0.0"
description = "Estimate ULS and MLS trajectories and occlusion from standardized LAS/LAZ collections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "laspy[lazrs]==2.6.1",
  "lazrs==0.7.0",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "pyproj==3.7.2",  # laspy needs it to read the CRS from the header
  "rasterio==1.4.3",  # occlusion COG
]
# The package builds its C++17 ray walker. Occlusion also needs Untwine 1.5.1
# at /opt/untwine/bin/untwine, or an executable set in TRAJECTORY_UNTWINE.
# The whole-grid reference tests use pip install --no-deps occpy_ls==0.3.0.

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
3dtrees-trajectory = "threedtrees_trajectory.cli:main"
3dtrees-trajectory-geojson = "threedtrees_trajectory.output:main_geojson"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
