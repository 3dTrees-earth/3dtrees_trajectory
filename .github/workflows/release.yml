name: Publish trajectory images on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/3dtrees-earth/3dtrees_trajectory
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import runpy
          import tomllib
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          package = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cli = runpy.run_path("src/threedtrees_trajectory/__init__.py")["__version__"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) or version != package or version != cli:
              raise SystemExit(f"Release {version!r} must match the package ({package}) and CLI ({cli}) versions")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"value={version}", file=output)
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
      - uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: "1.5.4"
      - name: Build, verify and publish the SIF from the pushed Docker digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | apptainer registry login -u "$ACTOR" --password-stdin docker://ghcr.io
          echo "$GHCR_TOKEN" | apptainer registry login -u "$ACTOR" --password-stdin oras://ghcr.io
          apptainer build tool.sif "docker://${IMAGE}@${DIGEST}"
          apptainer exec --cleanenv --contain tool.sif python /src/run.py --version
          apptainer push tool.sif "oras://${IMAGE}:${VERSION}-sif"
          apptainer pull check.sif "oras://${IMAGE}:${VERSION}-sif"
          cmp tool.sif check.sif
