name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps occpy_ls==0.3.0
      - run: |
          c++ -std=c++17 -O3 -fno-fast-math -ffp-contract=off -fPIC -shared \
              src/threedtrees_trajectory/ray_walk.cpp -o "$RUNNER_TEMP/_ray_walk.so"
          TRAJECTORY_RAY_WALK="$RUNNER_TEMP/_ray_walk.so" python -m pytest -q tests
